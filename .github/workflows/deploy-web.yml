name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не отменять уже идущий деплой, ставить в очередь
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_BOOSTY_URL: ${{ secrets.EXPO_PUBLIC_BOOSTY_URL }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ secrets.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_GOOGLE_FORM_URL: ${{ secrets.EXPO_PUBLIC_GOOGLE_FORM_URL }}
          EXPO_PUBLIC_YANDEX_FORM_URL: ${{ secrets.EXPO_PUBLIC_YANDEX_FORM_URL }}

      - name: Post-process (Jekyll off + iOS home-screen meta)
        run: |
          touch dist/.nojekyll
          cp assets/apple-touch-icon.png dist/apple-touch-icon.png
          sed -i 's#</head>#<link rel="apple-touch-icon" href="/recipes-app/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Рецепты"></head>#' dist/index.html
          sed -i 's#initial-scale=1, shrink-to-fit=no#initial-scale=1, shrink-to-fit=no, viewport-fit=cover#' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
